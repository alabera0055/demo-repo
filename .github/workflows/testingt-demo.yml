  name: TESTINGT demo
  on:
    workflow_dispatch:
  jobs:
    tests:
      runs-on: ubuntu-latest
      steps:
        - name: Write a test report
          run: |
            cat > results.xml <<'EOF'
            <testsuite name="login">
              <testcase classname="LoginTests" name="valid_login"/>
            </testsuite>
            EOF
        - name: Save results for Test Management
          if: always()
          uses: actions/upload-artifact@v4
          with:
            name: test-results
            path: results.xml