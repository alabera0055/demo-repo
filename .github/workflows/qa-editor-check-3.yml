name: QA editor check 3
on:
  workflow_dispatch:
jobs:
  first-job:
    runs-on: ubuntu-latest
    steps:
      - name: Say hello
        run: echo hello
      - name: Wait a little
        run: sleep 40
      - name: A step that fails
        run: exit 1
  second-job:
    runs-on: ubuntu-latest
    needs: first-job
    steps:
      - name: Say goodbye
        run: echo goodbye
